name: Deploy StockPilot demo to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stockpilot-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StockPilot/StockPilot/client/package-lock.json

      - name: Install client dependencies
        working-directory: StockPilot/StockPilot/client
        run: npm ci

      - name: Run client tests
        working-directory: StockPilot/StockPilot/client
        run: npm test

      - name: Build client for GitHub Pages
        working-directory: StockPilot/StockPilot/client
        env:
          GITHUB_PAGES: 'true'
          VITE_DEMO_MODE: 'true'
        run: npm run build

      - name: Add single-page app fallback
        working-directory: StockPilot/StockPilot/client
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: StockPilot/StockPilot/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
